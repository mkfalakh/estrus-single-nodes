<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Estrus Monitoring</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --danger: #ef4444;
      }

      :root.dark-mode {
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #334155;
        --danger: #ef4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .login-card {
        background: var(--card-bg);
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border-radius: 1rem;
        border: 1px solid var(--border);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .logo-container {
        width: 84px;
        height: 84px;
        background: #eff6ff;
        color: var(--primary);
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 60px;
      }

      :root.dark-mode .logo-container {
        background: #1e3a8a;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 0.5rem;
      }

      p.subtitle {
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-bottom: 2rem;
      }

      .form-group {
        text-align: left;
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 0.5rem;
      }

      .input-wrapper {
        position: relative;
      }

      input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-size: 0.875rem;
        outline: none;
        transition: all 0.2s;
        color: var(--text-main);
      }

      :root.dark-mode input {
        background: #0f172a;
        color: var(--text-main);
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .btn-login {
        width: 100%;
        padding: 0.75rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-login:hover {
        background: var(--primary-hover);
      }

      .error-message {
        background: #fef2f2;
        color: var(--danger);
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        margin-bottom: 1.25rem;
        border: 1px solid #fecaca;
        display: none;
      }

      :root.dark-mode .error-message {
        background: #7f1d1d;
        border: 1px solid #991b1b;
        color: #fca5a5;
      }

      .footer-text {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .btn-theme {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #e0e7ff;
        color: #3730a3;
        border: 1px solid #c7d2fe;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        position: absolute;
        top: 20px;
        right: 20px;
      }

      .btn-theme:hover {
        background: #c7d2fe;
        box-shadow: 0 2px 4px rgba(55, 48, 163, 0.1);
      }

      :root.dark-mode .btn-theme {
        background: #312e81;
        color: #a5b4fc;
        border: 1px solid #4f46e5;
      }

      :root.dark-mode .btn-theme:hover {
        background: #4f46e5;
        box-shadow: 0 2px 4px rgba(165, 180, 252, 0.1);
      }

      body {
        position: relative;
      }
    </style>
  </head>
  <body>
    <button class="btn-theme" id="themeToggle" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
      <!-- <span id="themeText">Dark</span> -->
    </button>

    <div class="login-card">
      <div class="logo-container">
        <!-- SVG Cow/Livestock Icon -->
        🐮
      </div>

      <h1>Estrus Monitoring</h1>
      <p class="subtitle">Silakan login untuk mengakses dashboard</p>

      <div id="error-box" class="error-message">
        Username atau password salah!
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="password"
            required
          />
        </div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span>Login</span>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <p class="footer-text">© 2026 Estrus Monitoring System - Offline Mode</p>
    </div>

    <script>
      // Theme Toggle Functionality
      function toggleTheme() {
        const html = document.documentElement;
        const themeIcon = document.getElementById("themeIcon");
        const themeText = document.getElementById("themeText");

        if (html.classList.contains("dark-mode")) {
          html.classList.remove("dark-mode");
          localStorage.setItem("theme", "light");
          themeIcon.textContent = "🌙";
          themeText.textContent = "Dark";
        } else {
          html.classList.add("dark-mode");
          localStorage.setItem("theme", "dark");
          themeIcon.textContent = "☀️";
          themeText.textContent = "Light";
        }
      }

      // Initialize theme on page load
      function initializeTheme() {
        const savedTheme = localStorage.getItem("theme") || "light";
        const html = document.documentElement;
        const themeIcon = document.getElementById("themeIcon");
        const themeText = document.getElementById("themeText");

        if (savedTheme === "dark") {
          html.classList.add("dark-mode");
          themeIcon.textContent = "☀️";
          themeText.textContent = "Light";
        } else {
          html.classList.remove("dark-mode");
          themeIcon.textContent = "🌙";
          themeText.textContent = "Dark";
        }
      }

      // Initialize theme immediately and when DOM is ready
      initializeTheme();
      document.addEventListener("DOMContentLoaded", initializeTheme);

      async function handleLogin(event) {
        event.preventDefault();

        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const errorBox = document.getElementById("error-box");
        const submitBtn = document.getElementById("submit-btn");

        try {
          const res = await fetch(`/api/login?user=${user}&pass=${pass}`, {
            method: "GET",
            credentials: "include",
          });

          // Loading
          submitBtn.disabled = true;
          submitBtn.innerHTML = "<span>Memproses...</span>";

          const data = await res.json();

          console.log("LOGIN RESPONSE:", data); // 🔥 DEBUG

          if (data.success) {
            console.log("redirecting...");
            window.location.href = "/index.html";
          } else {
            errorBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.innerHTML =
              '<span>Login</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
            document.getElementById("error-box").innerText =
              "Invalid credentials";
          }
        } catch (err) {
          console.error(err);
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<span>Login</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
          document.getElementById("error-box").innerText = "Server error";
        }
      }
    </script>
  </body>
</html>
